# Git-based deploy: Netlify clones the repo (no models in git), then this command
# downloads the weights from Hugging Face and packs `site/`.
# A full build downloads ~181 MB and uploads ~193 MB, so expect 1–3 minutes.

[build]
  command = "npm run build:site"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Multi-threaded WASM needs cross-origin isolation. `site/_headers` says the same
# thing, but keeping it here means the headers survive even if the publish dir
# layout changes.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
